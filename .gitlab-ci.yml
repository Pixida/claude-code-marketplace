# CI for the pixida-marketplace plugin marketplace.
# Runs on merge requests and on the default branch.
#
# If your project requires runner tags, add e.g. `tags: [docker]` to each job.

stages:
  - validate

# Primary gate: fast, offline, zero-dependency schema + hook check.
# No network and no auth, so it works even on locked-down runners.
schema-lint:
  stage: validate
  image: node:20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - node ci/validate-marketplace.mjs

# Official Claude Code validator. Pulls the CLI from npm, so it needs network
# access to your npm registry. Starts as allow_failure so a registry/runner
# hiccup can't block MRs — flip `allow_failure` to false once it runs green in
# your runners to make it a hard gate too.
claude-plugin-validate:
  stage: validate
  image: node:20
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    # Uncomment / adjust if you use an internal npm proxy:
    # NPM_CONFIG_REGISTRY: "https://npm.pixida.com/"
    CI: "true"
  script:
    - npm install -g @anthropic-ai/claude-code
    - claude plugin validate .
