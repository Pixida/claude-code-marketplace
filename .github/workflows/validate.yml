name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Primary gate: fast, offline, zero-dependency schema + hook check.
  schema-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Offline marketplace validation
        run: node ci/validate-marketplace.mjs

  # Official Claude Code validator. Pulls the CLI from npm; advisory for now.
  # Remove `continue-on-error` to make it a hard gate once it runs green.
  claude-plugin-validate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate .
